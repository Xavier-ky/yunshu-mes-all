spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fan_mes?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: 0
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations:
      - classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

logging:
  level:
    com.yunshu.mes: INFO
