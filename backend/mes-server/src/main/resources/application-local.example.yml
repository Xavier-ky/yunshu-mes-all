spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fan_mes?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/seed
    baseline-on-migrate: true
    validate-on-migrate: true
